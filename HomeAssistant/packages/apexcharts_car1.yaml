type: custom:apexcharts-card
experimental:
  color_threshold: true
# Visual style aligned with ev-charging-cards.js:
#   - same Apple system font and scheduled colours
#   - ha-card padding left at default to avoid ApexCharts width
#     miscalculation that custom padding can trigger
card_mod:
  style: |
    ha-card {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
header:
  show: true
  title: Charging Schedule
  show_states: false
graph_span: 24h
span:
  start: hour
now:
  show: true
  label: Now
  color: var(--info-color, "#2196f3")
apex_config:
  chart:
    type: bar
    stacked: true
    height: 260
    width: "100%"
    redrawOnParentResize: true
    redrawOnWindowResize: true
    fontFamily: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif
    foreColor: var(--secondary-text-color)
    zoom:
      enabled: true
      type: x
      autoScaleYaxis: true
    toolbar:
      show: true
      autoSelected: zoom
      tools:
        zoom: true
        zoomin: true
        zoomout: true
        pan: false
        reset: true
        download: false
        selection: false
  title:
    text: ""
  plotOptions:
    bar:
      columnWidth: "92%"
      borderRadius: 2
  states:
    hover:
      filter:
        type: lighten
        value: 0.1
  grid:
    borderColor: var(--divider-color)
    strokeDashArray: 4
  dataLabels:
    enabled: false
  legend:
    show: true
    position: top
    horizontalAlign: left
    fontSize: "12px"
    labels:
      colors: var(--secondary-text-color)
    markers:
      width: 10
      height: 10
      radius: 3
    showForSingleSeries: true
    formatter: |
      EVAL:function(seriesName) { return seriesName; }
  tooltip:
    x:
      format: "dd.MM HH:mm"
    "y":
      formatter: |
        EVAL:function(val) { return val > 0 ? val.toFixed(2) + ' c/kWh' : ''; }
  yaxis:
    forceNiceScale: true
    title:
      text: "c/kWh"
      style:
        fontSize: "11px"
        fontWeight: 400
        color: var(--secondary-text-color)
    labels:
      style:
        fontSize: "11px"
  xaxis:
    labels:
      style:
        fontSize: "11px"
series:
  - entity: sensor.ev_charging_schedule
    name: "Scheduled"
    color: "#4caf50"
    type: column
    show:
      legend_value: false
    data_generator: |
      const attr = entity.attributes.car1;
      if (!attr || !attr.timestamps) return [];
      const result = [];
      attr.timestamps.forEach((ts, i) => {
        if (attr.status[i] === 'past') return;
        result.push([
          new Date(ts).getTime(),
          attr.allowed[i] === 1 ? attr.prices[i] : 0
        ]);
      });
      return result;

  - entity: sensor.ev_charging_schedule
    name: "Not scheduled"
    color: "#9e9e9e"
    type: column
    show:
      legend_value: false
    data_generator: |
      const attr = entity.attributes.car1;
      if (!attr || !attr.timestamps) return [];
      const result = [];
      attr.timestamps.forEach((ts, i) => {
        if (attr.status[i] === 'past') return;
        result.push([
          new Date(ts).getTime(),
          attr.allowed[i] === 0 ? attr.prices[i] : 0
        ]);
      });
      return result;
